[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vseim-research"
version = "0.2.0"
description = "Visual vessel draft reconstruction, CCTV-AIS association and emission inventory workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1", "numpy>=1.24", "matplotlib>=3.7", "scipy>=1.10"]

[project.optional-dependencies]
vision = ["torch>=2.2", "transformers>=4.40,<5"]

[project.scripts]
vesselviz = "vesselviz.cli:main"
vseim = "vesselviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
